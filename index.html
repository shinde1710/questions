      // =========================================

      const container = document.getElementById("questionsContainer");

      function renderQuestions(list) {
        container.innerHTML = "";

        list.forEach((q, index) => {
          const card = document.createElement("div");

          card.className = "question-card";

          let optionsHTML = "";

          q.options.forEach((opt, i) => {
            const isCorrect = i === q.correct;

            optionsHTML += `
        <div 
          class="option"
          onclick="

            const options = this.parentElement.querySelectorAll('.option');

            options.forEach(opt => {
              opt.style.pointerEvents = 'none';
            });

            if(${isCorrect}){

              this.style.background = '#16a34a';

            }else{

              this.style.background = '#dc2626';

              options[${q.correct}].style.background = '#16a34a';
            }

          "
        >
          ${String.fromCharCode(65 + i)}. ${opt}
        </div>
      `;
          });

          card.innerHTML = `
      <div class="question-id">
        ID: ${q.id}
      </div>

      <div class="question">
        ${index + 1}. ${q.text}
      </div>

      ${optionsHTML}

      ${
        q.image
          ? `
          <img 
            src="./images/${q.image}"
            width="300"

            onerror="
              let num = '${q.image}'.replace('.webp','');

              this.src='./images/' + num + '_' + (parseInt(num)+1) + '.webp';
            "
          >
        `
          : ""
      }

      <div class="meta">
        Dimension: ${q.dimension || "N/A"} |
        Difficulty: ${q.difficulty || "N/A"}
      </div>
    `;

          container.appendChild(card);
        });
      }

      renderQuestions(data.questions);

      // SEARCH FUNCTION

      document.getElementById("search").addEventListener("input", function () {
        const value = this.value.toLowerCase();

        const filtered = data.questions.filter((q) =>
          q.text.toLowerCase().includes(value),
        );

        renderQuestions(filtered);
      });
    </script>
